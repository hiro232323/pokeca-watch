<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>POKÉ WATCH | ポケカ相場ウォッチ</title>
<style>
:root{color-scheme:dark;--bg:#0c111b;--panel:#171f2d;--line:#303b4d;--text:#eef3fb;--sub:#9daec7;--accent:#7bd9d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1140px;padding:28px 18px 80px;margin:auto}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-size:28px;font-weight:850;letter-spacing:.03em}.brand em{font-style:normal;color:var(--accent)}.subtitle{font-size:13px;color:var(--sub);margin-top:4px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.metric{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px}.metric strong{display:block;font-size:27px;margin-top:8px}.metric span{font-size:12px;color:var(--sub)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{min-height:43px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:0 13px}.toolbar input{flex:1;min-width:220px}.toolbar select{min-width:155px}
.status{color:var(--sub);font-size:13px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:15px;padding:17px;background:var(--panel)}.top{display:flex;gap:12px;min-height:86px}.thumb{width:62px;height:86px;object-fit:contain;background:#101724;border:1px solid #354053;border-radius:7px}.placeholder{width:62px;height:86px;border-radius:7px;display:grid;place-items:center;background:#111b2a;color:#6d819c;font-size:11px;text-align:center}.card h2{font-size:17px;margin:2px 0 8px;overflow-wrap:anywhere}.id{font-size:12px;color:var(--sub)}.prices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.price{padding:12px;background:#101724;border-radius:10px}.price span{color:var(--sub);font-size:11px}.price b{display:block;font-size:20px;margin-top:4px}.chart-title{color:var(--sub);font-size:12px;margin:9px 0 5px}.spark{width:100%;height:60px;background:#101724;border-radius:9px}.nohistory{height:60px;display:grid;place-items:center;color:var(--sub);background:#101724;border-radius:9px;font-size:12px}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.links a{font-size:12px;padding:8px 10px;border-radius:8px;background:#283548;color:#dff7ff;text-decoration:none}.links a:hover{background:#38526c}.empty{padding:38px 16px;border:1px dashed #526078;border-radius:14px;text-align:center;color:var(--sub);line-height:1.9}.foot{color:var(--sub);font-size:12px;line-height:1.8;margin-top:30px}
@media(max-width:550px){.summary{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:span 2}.brand{font-size:24px}}
</style>
</head>
<body><main>
<header><div><div class="brand">POKÉ <em>WATCH</em></div><div class="subtitle">ポケカ相場ウォッチ | 通常・PSA10・価格推移</div></div><div class="subtitle" id="updated">最終更新：未取得</div></header>
<section class="summary"><div class="metric"><span>登録カード</span><strong id="total">0 枚</strong></div><div class="metric"><span>通常価格を取得済み</span><strong id="rawcount">0 枚</strong></div><div class="metric"><span>PSA10価格を取得済み</span><strong id="psacount">0 枚</strong></div></section>
<div class="toolbar"><input id="search" placeholder="カード名・カード番号で検索" aria-label="カード検索"><select id="filter" aria-label="表示するカード"><option value="all">すべてのカード</option><option value="raw">通常価格あり</option><option value="psa10">PSA10価格あり</option><option value="missing">価格未取得</option></select><select id="sort" aria-label="並び替え"><option value="name">カード名順</option><option value="rawdesc">通常価格が高い順</option><option value="psadesc">PSA10価格が高い順</option></select></div>
<div class="status" id="status">価格データを確認しています…</div><section class="cards" id="cards"></section>
<p class="foot">※掲載価格は入力・取得した記録であり、リアルタイム取引価格ではありません。価格の出典と更新日を確認してください。画像は許諾・利用条件が確認されたURLが登録された場合のみ表示します。</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let cards=[],history=[];
const money=n=>Number.isFinite(n)?n.toLocaleString('ja-JP')+'円':'未取得';
function elem(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function spark(entries){const pts=entries.filter(x=>Number.isFinite(x.raw_price)).sort((a,b)=>a.date.localeCompare(b.date));if(pts.length<2)return elem('div','nohistory','価格履歴が2件以上になるとグラフを表示');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 260 60');svg.setAttribute('class','spark');svg.setAttribute('role','img');svg.setAttribute('aria-label','通常価格の推移');const vals=pts.map(p=>p.raw_price),min=Math.min(...vals),max=Math.max(...vals),spread=max-min||1;const path=document.createElementNS('http://www.w3.org/2000/svg','polyline');path.setAttribute('points',vals.map((n,i)=>(8+i*244/(vals.length-1)).toFixed(2)+','+(51-(n-min)/spread*42).toFixed(2)).join(' '));path.setAttribute('stroke','#7bd9d0');path.setAttribute('stroke-width','2.5');path.setAttribute('fill','none');svg.append(path);return svg}
function marketLink(label,url){const a=elem('a','',label+' ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function render(){const q=$('search').value.toLocaleLowerCase('ja'),f=$('filter').value,s=$('sort').value;let rows=cards.filter(c=>((c.name||'')+' '+c.card_id).toLocaleLowerCase('ja').includes(q)).filter(c=>f==='all'||(f==='raw'&&Number.isFinite(c.raw_price))||(f==='psa10'&&Number.isFinite(c.psa10_price))||(f==='missing'&&!Number.isFinite(c.raw_price)&&!Number.isFinite(c.psa10_price)));if(s==='rawdesc')rows.sort((a,b)=>(b.raw_price??-1)-(a.raw_price??-1));else if(s==='psadesc')rows.sort((a,b)=>(b.psa10_price??-1)-(a.psa10_price??-1));else rows.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));$('status').textContent=rows.length+' 件を表示';const wrap=$('cards');wrap.replaceChildren();if(!rows.length){const m=elem('div','empty',cards.length?'条件に一致するカードはありません。':'カードデータはまだありません。\n最初に data/price_updates.csv に確認済みの価格情報を登録してください。');m.style.whiteSpace='pre-line';wrap.append(m);return}for(const c of rows){const article=elem('article','card'),top=elem('div','top');if(typeof c.image_url==='string'&&/^https:\/\//.test(c.image_url)){const img=elem('img','thumb');img.src=c.image_url;img.alt=c.name||'カード画像';img.loading='lazy';img.onerror=()=>img.replaceWith(elem('div','placeholder','画像なし'));top.append(img)}else top.append(elem('div','placeholder','画像なし'));const head=elem('div');head.append(elem('h2','',c.name||'名称未登録'),elem('div','id',c.card_id));top.append(head);article.append(top);const prices=elem('div','prices');for(const [label,key] of [['通常価格','raw_price'],['PSA10','psa10_price']]){const box=elem('div','price');box.append(elem('span','',label),elem('b','',money(c[key])));prices.append(box)}article.append(prices,elem('div','chart-title','通常価格の推移'));article.append(spark(history.filter(h=>h.card_id===c.card_id)));const links=elem('div','links'),term=encodeURIComponent((c.name||'')+' '+c.card_id);links.append(marketLink('メルカリ','https://jp.mercari.com/search?keyword='+term),marketLink('ヤフオク','https://auctions.yahoo.co.jp/search/search?p='+term),marketLink('スニダン','https://snkrdunk.com/search?keyword='+term));article.append(links);wrap.append(article)}}
async function fetchJson(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
(async()=>{try{const [p,h]=await Promise.allSettled([fetchJson('data/prices.json'),fetchJson('data/history.json')]);cards=p.status==='fulfilled'&&Array.isArray(p.value)?p.value:[];history=h.status==='fulfilled'&&Array.isArray(h.value)?h.value:[];$('total').textContent=cards.length+' 枚';$('rawcount').textContent=cards.filter(c=>Number.isFinite(c.raw_price)).length+' 枚';$('psacount').textContent=cards.filter(c=>Number.isFinite(c.psa10_price)).length+' 枚';const dates=history.map(x=>x.date).filter(Boolean).sort();if(dates.length)$('updated').textContent='最終記録日：'+dates.at(-1);render()}catch(e){$('status').textContent='データを読み込めませんでした。';console.error(e)}})();
for(const id of ['search','filter','sort'])$(id).addEventListener(id==='search'?'input':'change',render);
</script></body></html>
