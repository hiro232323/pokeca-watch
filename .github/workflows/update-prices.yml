name: Pokemon Card Price Update

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokewatch-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import authorized price feed (if configured)
        env:
          POKEWATCH_FEED_URL: ${{ vars.POKEWATCH_FEED_URL }}
          POKEWATCH_FEED_TOKEN: ${{ secrets.POKEWATCH_FEED_TOKEN }}
        run: python3 scripts/import_price_feed.py
      - name: Generate price history and current prices
        run: python3 scripts/update_prices.py
      - name: Update free Japanese card metadata (not images)
        run: python3 scripts/update_catalog.py
      - name: Commit only changed price records
        run: |
          if [ -n "$(git status --porcelain -- data/price_updates.csv data/prices.json data/history.json data/catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/price_updates.csv data/prices.json data/history.json data/catalog.json
            git commit -m "Update verified card price records"
            git push
          else
            echo "No new verified prices; existing records preserved."
          fi
